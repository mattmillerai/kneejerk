# GoReleaser and the Homebrew formula bump run as jobs in this same workflow,
# rather than as separate workflows triggered by the release-please tag/
# release, because tags and releases created with the default GITHUB_TOKEN do
# not trigger other GitHub Actions workflows. Keeping everything in one
# workflow run (gated on the release-please job's outputs) sidesteps that.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # PRs opened by release-please with GITHUB_TOKEN do not trigger workflow
      # runs, but workflow_dispatch is exempt from that rule, so we dispatch CI
      # explicitly on the release PR branch.
      - name: Dispatch CI on the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(jq -r ".headBranchName // empty" <<<"${PR:-null}")
          if [ -z "$BRANCH" ]; then echo "no release PR branch, skipping"; exit 0; fi
          gh workflow run ci.yml --ref "$BRANCH"

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: kneejerk
          formula-path: Formula/kneejerk.rb
          homebrew-tap: mattmillerai/homebrew-tap
          base-branch: main
          tag-name: ${{ needs.release-please.outputs.tag_name }}
          download-url: https://github.com/mattmillerai/kneejerk/archive/refs/tags/${{ needs.release-please.outputs.tag_name }}.tar.gz
          create-pullrequest: false
          create-branch: false
          commit-message: "{{formulaName}} {{version}}"
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
